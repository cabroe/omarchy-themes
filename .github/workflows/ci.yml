name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs for the same ref on new commits.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Kein workflow-weites Default — jeder Job deklariert seine eigenen Permissions
# (least-privilege per job statt globalem Deckel).
permissions: {}

jobs:
  check:
    name: make check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # 22 = the documented minimum (registerHooks needs >= 22.15), lts/* = what
        # a user installing today gets. Catches Node behaviour changes early.
        node: ['22', 'lts/*']
    steps:
      # Externe Actions auf Commit-SHA gepinnt — Tags/Branches sind mutable
      # und ein einziger Compromised-Tag würde jeden CI-Lauf kompromittieren.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}

      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install shellcheck
        # Auf GitHub-hosted ubuntu-latest läuft alles als root — sudo entfällt.
        # linuxbrew/shellcheck wäre eine Alternative, apt-get ist auf Ubuntu schneller.
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run make check
        # = lint (node --check, py_compile, shellcheck) + test (smoke.mjs, hook.sh)
        # Kein Netz, keine Secrets — rein lokale Checks.
        run: make check
