name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs for the same ref on new commits.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Kein workflow-weites Default — jeder Job deklariert seine eigenen Permissions
# (least-privilege per job statt globalem Deckel).
permissions: {}

jobs:
  check:
    name: make check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # 22 = the documented minimum (registerHooks needs >= 22.15), lts/* = what
        # a user installing today gets. Catches Node behaviour changes early.
        node: ['22', 'lts/*']
    steps:
      # Externe Actions auf Commit-SHA gepinnt — Tags/Branches sind mutable
      # und ein einziger Compromised-Tag würde jeden CI-Lauf kompromittieren.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Setup Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install shellcheck
        # Auf GitHub-hosted ubuntu-latest läuft alles als root — sudo entfällt.
        # linuxbrew/shellcheck wäre eine Alternative, apt-get ist auf Ubuntu schneller.
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run make check
        # = lint (node --check, py_compile, shellcheck) + test (smoke.mjs, hook.sh)
        # Kein Netz, keine Secrets — rein lokale Checks.
        run: make check

      - name: Run make typecheck
        # tsc --allowJs --checkJs --noEmit gegen desktop/tsconfig.json.
        # Laufzeit: ~30 s beim ersten Mal (npm install typescript via npx),
        # <1 s nach dem ersten Cache-Hit. Keine Secrets.
        run: make typecheck
