name: Pages consistency

# Erzwingt das Drift-Gate zwischen dem main-Branch (desktop/plugin.js, hooks/)
# und dem deployten gh-pages-Branch (Homepage). Der Job ist bewusst getrennt von
# ci.yml: ci.yml laeuft als Matrix und ruft `make check` auf, das ohne lokalen
# gh-pages-Checkout sichtbar skippt — genau dieses Skippen darf hier nicht
# passieren, deshalb ruft dieser Job das Gate direkt mit festem PAGES_DIR auf.
#
# F1 — der Code-Ref wird pro Trigger explizit aufgeloest (Mechanismus b).
# actions/checkout ohne `ref:` nimmt den Ref, der den Workflow ausgeloest hat.
# Bei einem Push auf gh-pages waere das die *deployte Seite*: der erste
# Checkout (path: main) lieferte dann gh-pages-Inhalt, das Gate faende
# scripts/check-pages-consistency.py nicht und endete dauerhaft mit Exit 2.
# Ein pauschales `ref: main` waere aber genauso falsch: bei pull_request
# muesste dann main gegen gh-pages geprueft werden statt der PR-Inhalt — genau
# die Drift, fuer die das Gate gebaut ist, bliebe unentdeckt. Deshalb loest
# der erste Step den Code-Ref explizit auf:
#
#   push main         -> github.sha             (der gepushte Commit)
#   pull_request main -> github.sha             (PR-Merge-Commit = PR + Base)
#   push gh-pages     -> Default-Branch (main)  (Code-Stand, nie die Seite)
#   workflow_dispatch -> github.sha             (Ref, auf dem gestartet wurde)
#
# Der zweite Checkout (path: pages) ist in allen Faellen die Seite. Damit
# prueft die Matrix push main / pull_request main / push gh-pages jeweils den
# *Code*-Stand gegen die Seite — nie die Seite als Code.
#
# Voraussetzung fuer den gh-pages-Trigger: GitHub liest Workflow-Dateien aus
# dem gepushten Ref, dieser Trigger feuert also erst, wenn diese Datei auch auf
# gh-pages liegt (dort laeuft dann sogar diese Fassung, nicht die auf main).
# gh-pages wird in diesem Repo nicht per Workflow deployt, sondern von Hand
# gepflegt — solange die Datei dort fehlt, ist der Trigger inert und schadet
# nicht; main und pull_request sind davon unabhaengig.
on:
  push:
    branches: [main, gh-pages]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-consistency-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  pages-consistency:
    name: gh-pages drift gate
    # GitHub-hosted, NICHT self-hosted: der self-hosted Runner ist offline
    # (siehe Analyse A3: Jobs liefen 24 h in den Timeout, steps: []).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # F1: Code-Ref VOR jedem Checkout aufloesen. Shell statt verschachtelter
      # `&&`/`||`-Expressions, damit die Matrix oben eins zu eins im Log steht.
      # Kein Secret, keine Schreibrechte, kein Netzzugriff.
      - name: Resolve code ref (never the pushed gh-pages tree)
        id: code-ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" = "refs/heads/gh-pages" ]; then
            if [ -z "$DEFAULT_BRANCH" ] || [ "$DEFAULT_BRANCH" = "gh-pages" ]; then
              echo "FAIL: default branch is '${DEFAULT_BRANCH:-<unset>}' — no code tree to compare the page against"
              exit 2
            fi
            echo "ref=$DEFAULT_BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

      # Externe Actions auf Commit-SHA gepinnt — Tags/Branches sind mutable und
      # ein kompromittierter Tag wuerde jeden Lauf mitnehmen. Dieselben Pins wie
      # in ci.yml, damit ein Renovate/Dependabot-Bump beide Dateien zusammen trifft.
      - name: Checkout code (${{ steps.code-ref.outputs.ref }})
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.code-ref.outputs.ref }}
          path: main
          persist-credentials: false

      - name: Checkout gh-pages (deployed homepage)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: pages
          persist-credentials: false

      - name: Setup Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Show trigger and checked-out commits
        run: |
          echo "event:     ${{ github.event_name }} on ${{ github.ref }}"
          echo "code ref:  ${{ steps.code-ref.outputs.ref }} (requested)"
          echo "code       $(git -C main rev-parse HEAD)"
          echo "gh-pages   $(git -C pages rev-parse HEAD)"

      - name: Enforce gate (drift fails the job)
        working-directory: main
        env:
          PAGES_DIR: ${{ github.workspace }}/pages
        run: |
          # Kein Skip-Pfad in CI: fehlt der Checkout, ist das ein harter Fehler
          # (Exit 2), kein stilles Ueberspringen. Exit 1 = Drift, Exit 2 = Parse/IO.
          test -f "$PAGES_DIR/themes.js" || {
            echo "FAIL: no gh-pages checkout at $PAGES_DIR (themes.js missing)"
            exit 2
          }
          python3 scripts/check-pages-consistency.py --pages "$PAGES_DIR" --root .
