name: regen-themes

# Triggers:
#  - workflow_dispatch:    manual from the Actions tab / `gh workflow run`
#  - schedule (Mon 04:00 UTC): weekly catch — runs a day after the Sunday
#                              smoke. If upstream Omarchy added or removed a
#                              theme the table is refreshed and a PR opened
#                              for the owner to review and merge.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

# One regen run per ref at a time. A new commit cancels the previous
# in-progress run for that ref — regeneration takes ~10 s, no point
# queueing duplicates.
concurrency:
  group: regen-themes-${{ github.ref }}
  cancel-in-progress: true

# Workflow-weites Default: keine Permissions. Der Job deklariert seine
# eigenen (least-privilege). OIDC-Token wird nicht angefordert.
permissions: {}

jobs:
  regen:
    name: regenerate plugin.js from omarchy themes
    # Label-Match: nur Runner mit allen drei Labels akzeptieren den Job.
    # Der omarchy-Runner trägt genau diese Labels (config.sh --labels ...).
    runs-on: [self-hosted, omarchy, omarchy-themes]
    # 10 min reicht locker: `make generate` liest ~30 themes via zwei
    # SSH-Roundtrips (SYSTEM_DIR + USER_DIR). Selbst auf einem lahmen
    # Laptop bleibt es unter 30 s.
    timeout-minutes: 10

    # contents: write brauchen wir für das Pushen eines feature-Branches
    # und das Öffnen eines PRs. pull-requests: write für create-pull-request.
    permissions:
      contents: write
      pull-requests: write

    steps:
      # Externe Actions auf Commit-SHA gepinnt — Tags/Branches sind mutable
      # und ein einziger Compromised-Tag würde jeden CI-Lauf kompromittieren.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `make lint` ruft shellcheck — sicherstellen, dass es installiert ist,
      # bevor der lint-Step sonst mit "command not found" abbricht.
      - name: Install shellcheck
        run: |
          if ! command -v shellcheck >/dev/null; then
            sudo pacman -S --noconfirm --needed shellcheck
          fi
          shellcheck --version

      # Generator liest /usr/share/omarchy/themes direkt — der Runner *ist*
      # der Omarchy-Host, kein SSH-Hop nötig. User-Themes (USER_DIR) werden
      # nicht gebaked — sie werden live aus current/theme/colors.toml gelesen.
      - name: Run make generate
        run: make generate

      # Syntaxcheck des generierten Ergebnisses — fängt kaputte Paletten ab,
      # bevor sie in einem PR landen.
      - name: Lint generated output
        run: make lint

      # Statt eines direkten Pushes auf das geschützte main: feature-Branch +
      # PR. github-actions[bot] ist kein Admin, ein direkter `git push` würde
      # mit GH006 abgelehnt; mit GITHUB_TOKEN werden die CI-Status-Checks
      # zudem nicht ausgelöst, sodass der Push selbst dann durchginge, wenn
      # main nicht geschützt wäre.
      - name: Open PR if changed
        uses: peter-evans/create-pull-request@27186a8b7c8b95ee83e8d5569b47486a73ad6e0e # v7.0.5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(generated): regenerate theme table from omarchy"
          title: "chore(generated): regenerate theme table from omarchy"
          body: |
            Automated weekly regeneration of `desktop/plugin.js` from
            `/usr/share/omarchy/themes` on the self-hosted omarchy runner.

            - No manual review required if only the generated block changed
            - CI (`make check`) must pass before merge
          branch: chore/regen-themes
          delete-branch: true
