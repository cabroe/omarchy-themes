name: live-theme-smoke

# Triggers:
#  - workflow_dispatch:        manual from the Actions tab / `gh workflow run`
#  - schedule (Sun 04:00 UTC): weekly catch — runs even when nothing changed,
#                              catches Omarchy-side drift
#  - push (main, paths):       only when one of the files the smoke actually
#                              exercises changes. The hook chain, the test
#                              script, and this workflow itself.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 0'
  push:
    branches: [main]
    paths:
      - 'tests/theme-switch-smoke.sh'
      - 'hooks/hermes-skin-sync.sh'
      - '.github/workflows/live-theme-smoke.yml'

# One live-smoke run per ref at a time. A new commit cancels the previous
# in-progress run for that ref — the smoke takes ~5-10 min, no point
# queueing duplicates.
concurrency:
  group: live-smoke-${{ github.ref }}
  cancel-in-progress: true

# Workflow-weites Default: keine Permissions. Der Job deklariert seine
# eigenen (least-privilege). OIDC-Token wird nicht angefordert — der Job
# pusht nichts und braucht keine Cloud-Credentials.
permissions: {}

jobs:
  smoke:
    name: live theme switch smoke (omarchy self-hosted)
    # Label-Match: nur Runner mit allen drei Labels akzeptieren den Job.
    # Der omarchy-Runner trägt genau diese Labels (config.sh --labels ...),
    # sodass keine versehentliche Verteilung auf andere Hosts erfolgt.
    runs-on: [self-hosted, omarchy, omarchy-themes]
    # 30 min reicht für ~11 Themes á ~5-30 s inkl. Hook-Chain-Settle.
    # `make theme-smoke` SCPt nach localhost und ruft das Test-Script
    # remote — beide Schritte addieren etwas Overhead.
    timeout-minutes: 30

    # Read-only auf den Source-Code, sonst nichts.
    permissions:
      contents: read

    steps:
      # Externe Actions auf Commit-SHA gepinnt — Tags/Branches sind mutable
      # und ein einziger Compromised-Tag würde jeden CI-Lauf kompromittieren.
      # SHA-Pin matched das `ci.yml`-House-Styling.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Der Runner ist omarchy selbst, also SCP nach localhost und dort
      # `omarchy theme set` ausführen. Das ist genau das, was der lokale
      # `make theme-smoke HOST=omarchy`-Aufruf macht, nur dass der Runner
      # der omarchy-Host ist und damit der SSH-Hop localhost ist.
      # Der Job hat absichtlich keine Secrets: kein GH_TOKEN, kein
      # DEPLOY_KEY, nichts — der Test mutiert nur lokale User-State des
      # Runner-Users und restored am Ende den ACTIVE_BEFORE-Skin.
      - name: Run make theme-smoke
        run: make theme-smoke HOST=localhost